name: prepare-release

# Opens (or refreshes) a release/x.y.z pull request: bumps versions, moves the
# Unreleased changelog section under the new version, regenerates docs.
# Merging that PR into main triggers finalize-release.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: How to derive the next version
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, custom]
      version:
        description: Version in x.y.z form when release type is custom
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(node scripts/release/bump-version.mjs --next "$RELEASE_TYPE" "${REQUESTED:-}")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: Apply version bump
        run: |
          node scripts/release/bump-version.mjs "${{ steps.version.outputs.value }}"
          pnpm build
          pnpm docs:generate
          pnpm format

      - name: Validate bumped tree
        run: pnpm check

      - name: Commit and push release branch
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/${VERSION}"
          git checkout -B "$branch"
          git add -A
          git commit -m "Prepare release ${VERSION}"
          git push --force-with-lease origin "$branch"

      - name: Open or refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          branch="release/${VERSION}"
          body="$(node scripts/release/bump-version.mjs --notes "$VERSION")"
          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" --title "Release ${VERSION}" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Release ${VERSION}" --body "$body" --label release
          fi
