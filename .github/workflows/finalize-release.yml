name: finalize-release

# Runs when a release/x.y.z or hotfix/x.y.z pull request merges into main:
# tags, builds, attests, publishes npm packages and the GitHub release, then
# deploys the hosted app to Spacefast and smoke-tests it, rolling back on failure.
# A branch push never publishes anything.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finalize-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Derive version from branch
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^(release|hotfix)/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "value=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release branch: $HEAD_REF" >&2
            exit 1
          fi

      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify versions match the branch
        run: node scripts/release/bump-version.mjs --verify "${{ steps.version.outputs.value }}"

      - name: Full validation
        run: pnpm check

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p .release
          (cd apps/web/dist && zip -qr "../../../.release/web-dist-${{ steps.version.outputs.value }}.zip" .)
          cp packages/catalog/dist/catalog.json ".release/catalog-${{ steps.version.outputs.value }}.json"
          cp packages/catalog/dist/schema/scan-result.schema.json ".release/scan-result.schema.json"
          cp packages/catalog/dist/schema/catalog.schema.json ".release/catalog.schema.json"
          for pkg in catalog core mcp cli; do
            (cd "packages/$pkg" && pnpm pack --pack-destination ../../.release >/dev/null)
          done
          ls -la .release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .release/*

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists."
          else
            git tag -a "v${VERSION}" -m "Release ${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi
          pnpm -r --filter './packages/*' publish --access public --provenance --no-git-checks

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          notes="$(node scripts/release/bump-version.mjs --notes "$VERSION")"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" .release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v${VERSION}" .release/* --repo "$GITHUB_REPOSITORY" --title "v${VERSION}" --notes "$notes"
          fi

  deploy:
    name: Deploy to Spacefast
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      SPACEFAST_TOKEN: ${{ secrets.SPACEFAST_TOKEN }}
      SPACEFAST_SPACE: ${{ vars.SPACEFAST_SPACE }}
      SMOKE_TARGET: ${{ vars.SMOKE_TARGET }}
    steps:
      - name: Skip when Spacefast is not configured
        id: gate
        run: |
          if [ -z "${SPACEFAST_TOKEN}" ] || [ -z "${SPACEFAST_SPACE}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SPACEFAST_TOKEN or SPACEFAST_SPACE is not set; skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Set up pnpm
        if: steps.gate.outputs.configured == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build
        if: steps.gate.outputs.configured == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish live version
        if: steps.gate.outputs.configured == 'true'
        id: publish
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm install -g spacefast
          sf versions --json > before.json || echo '{}' > before.json
          sf publish ./dist --message "v${{ needs.release.outputs.version }}" --json > receipt.json
          jq . receipt.json
          echo "live=$(jq -r '.data.space.liveUrl' receipt.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.data.version.ref // .data.version.id' receipt.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke test the live address
        if: steps.gate.outputs.configured == 'true'
        id: smoke
        env:
          LIVE: ${{ steps.publish.outputs.live }}
        run: |
          set -euo pipefail
          curl -fsS "${LIVE}/health" | jq -e '.ok == true'
          curl -fsS "${LIVE}/.well-known/mcp/server-card.json" | jq -e '.endpoint'
          if [ -n "${SMOKE_TARGET}" ]; then
            curl -fsS -X POST "${LIVE}/api/scan" -H 'content-type: application/json' \
              -d "{\"url\":\"${SMOKE_TARGET}\"}" | jq -e '.result.level.value >= 0'
          fi

      - name: Roll back on smoke failure
        if: steps.gate.outputs.configured == 'true' && failure() && steps.publish.outcome == 'success'
        working-directory: apps/web
        run: |
          set -euo pipefail
          previous="$(jq -r '[.data[]? | select(.live == true or .isLive == true)][0].ref // empty' before.json)"
          if [ -n "$previous" ]; then
            echo "Rolling back live to $previous"
            sf rollback "$previous" --yes --json
          else
            echo "No previous live version recorded; leaving the pointer in place." >&2
          fi
